<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servidor Empresa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
            margin-top: 50px;
        }
        h1 {
            color: #2c3e50;
        }
        .box {
            background: white;
            padding: 20px;
            margin: auto;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        a {
            display: block;
            margin: 10px;
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
        }
        a:hover {
            color: #1abc9c;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Bienvenido</h1>
        <p>Servidor de archivos</p>

        <a href="Prueba.pdf">Descargar Manual</a>
        <a href="archivo.zip">Descargar Archivo ZIP</a>
    </div>

</body>
</html>
